<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Ratgeber-Illustrationen erzeugen</title>
<!-- Erzeugt assets/img/ratgeber/<slug>.svg (800 × 350) für neue Ratgeber im Stil der bestehenden Titelbilder.
     Aufruf über tools/gen/ratgeber.ps1. Der erste Kommentar in jeder SVG wird zum Alt-Text (siehe tools/build.pl). -->
<script src="../../_marketing/pins/art-teile.js"></script>
</head><body>
<script>
const { K, at, o, defs, label, shine, T } = window.ARTKIT;
const COL = {
  fitness: ['#ff9a6b', '#ff5a1f', '#b83a0a'], kampfsport: ['#ff5c61', '#e0262b', '#8f1014'],
  fussball: ['#4ade80', '#16a34a', '#0c6b30'], running: ['#d9f566', '#a3cf1c', '#5f8100'],
  radsport: ['#a78bfa', '#7c3aed', '#4c1d95'], schwimmen: ['#60a5fa', '#1d6fe0', '#0f3f8f'],
  wintersport: ['#8fe0ff', '#38bdf8', '#0e7fb6'], racket: ['#5eead4', '#14b8a6', '#0b7266']
};
const lin = (id, a, b, v = true) => `<linearGradient id="${id}" x1="0" y1="0" x2="${v ? 0 : 1}" y2="${v ? 1 : 0}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const glow = (id, cx, cy, r, c, op = 0.5) => `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${c}" stop-opacity="${op}"/><stop offset="0.6" stop-color="${c}" stop-opacity="${op / 5}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
const tick = (x, y, c, s = 1) => at(x, y, s, 0, `<path d="M0 0l28 28 56-64" fill="none" stroke="${c}" stroke-width="20" stroke-linecap="square" opacity="0.22"/>`);
const flakes = pts => pts.map(([x, y, s]) => at(x, y, s, 0, `<path d="M0-10V10M-9-5L9 5M-9 5L9-5" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>`)).join('');

function scene(sport, desc, extra, body, wall = ['#141414', '#2e2e2e']) {
  const c = COL[sport];
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" aria-hidden="true">
  <!-- ${desc} -->
  ${defs(c, lin('wall', wall[0], wall[1]) + glow('light', 440, -60, 460, c[0]) + extra)}
  <rect width="800" height="350" fill="url(#wall)"/><rect width="800" height="350" fill="url(#light)"/>
  ${body}
</svg>`;
}

// ---------- Eigene Teile ----------
// Aufgerollte Bandage
const roll = (r, fill) => `<g><circle r="${r}" fill="${fill}" ${o()}/>
  <circle r="${(r * 0.72).toFixed(1)}" fill="none" stroke="${K}" stroke-width="2.5" opacity="0.35"/>
  <circle r="${(r * 0.44).toFixed(1)}" fill="none" stroke="${K}" stroke-width="2.5" opacity="0.35"/>
  <circle r="${(r * 0.17).toFixed(1)}" fill="${K}" opacity="0.6"/>
  ${shine(`M${-r * 0.62} ${-r * 0.62}a${r * 0.88} ${r * 0.88} 0 0 1 ${r * 0.74} ${-r * 0.22}`, 6, 0.4)}</g>`;

// MMA-Handschuh mit unterschiedlich dickem Polster über den Knöcheln
const mma = pad => `<g transform="translate(-60 -86)">
  <g fill="#f1cdb1" ${o(3.5)}><rect x="26" y="0" width="17" height="40" rx="8.5"/><rect x="45" y="-6" width="17" height="46" rx="8.5"/><rect x="64" y="-4" width="17" height="44" rx="8.5"/><rect x="83" y="4" width="16" height="36" rx="8"/></g>
  <path d="M14 70C4 66 0 84 8 96L22 112 28 82Z" fill="#f1cdb1" ${o(3.5)}/>
  <path d="M22 50H104C110 50 112 56 112 62V108C112 120 104 128 92 128H38C28 128 22 120 22 110Z" fill="url(#gm)" ${o()}/>
  <rect x="${18 - pad / 6}" y="${42 - pad}" width="${98 + pad / 3}" height="${30 + pad}" rx="${10 + pad / 3}" fill="url(#gm)" ${o()}/>
  ${shine(`M30 ${50 - pad}H${98 + pad / 6}`, 6, 0.4)}
  <path d="M30 96H104" stroke="#000" stroke-width="2.5" opacity="0.2"/>
  <rect x="24" y="126" width="88" height="44" rx="8" fill="url(#gk)" ${o()}/>
  <rect x="24" y="136" width="88" height="20" fill="#fff" opacity="0.9"/>
  <path d="M30 140h76M30 152h76" stroke="${K}" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/></g>`;

// Sohle von unten mit Profil
const SOLE = 'M0-134C42-134 54-92 52-52 50-12 38 8 38 40 38 82 46 112 32 130 20 142-20 142-32 130-46 112-38 82-38 40-38 8-50-12-52-52-54-92-42-134 0-134Z';
let soleId = 0;
function sole(kind) {
  const id = 'so' + (++soleId);
  let p = '';
  const herring = (y0, y1, step, w = 5) => { let s = ''; for (let y = y0; y <= y1; y += step) s += `M-60 ${y}L0 ${y + 12}L60 ${y}`; return `<path d="${s}" fill="none" stroke="#3a3a3a" stroke-width="${w}" stroke-linejoin="round"/>`; };
  if (kind === 'sand') p = herring(-150, 150, 13);
  if (kind === 'hart') p = herring(-20, 150, 15) + `<circle cy="-80" r="24" fill="none" stroke="#3a3a3a" stroke-width="5"/><circle cy="-80" r="12" fill="none" stroke="#3a3a3a" stroke-width="4"/>` +
    `<path d="M-50-130L50-110M-50-112L50-92M-50-48L50-30" stroke="#3a3a3a" stroke-width="5"/>`;
  if (kind === 'halle') p = `<path d="M-50-100C-20-110 20-90 50-100M-50-40C-20-50 20-30 50-40M-50 30C-20 20 20 40 50 30M-50 100C-20 90 20 110 50 100" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>`;
  if (kind === 'padel') { p = herring(-150, 150, 16, 4); for (let y = -120; y <= 120; y += 24) p += `<circle cx="-40" cy="${y}" r="4" fill="#3a3a3a"/><circle cx="40" cy="${y + 12}" r="4" fill="#3a3a3a"/>`; }
  return `<g><clipPath id="${id}"><path d="${SOLE}"/></clipPath>
    <path d="${SOLE}" fill="url(#sole)" ${o()}/>
    <g clip-path="url(#${id})">${p}</g>
    <path d="${SOLE}" fill="none" ${o()}/>
    ${shine('M-34-110C-22-126 4-128 22-122', 4, 0.5)}</g>`;
}

// Faltschloss: Glieder im Zickzack
function foldLock(n = 6, len = 62) {
  let pts = [[0, 0]], a = -0.6, s = '';
  for (let i = 0; i < n; i++) { a = i % 2 ? -0.62 : 0.62; const [x, y] = pts[pts.length - 1]; pts.push([x + Math.cos(a) * len, y + Math.sin(a) * len]); }
  for (let i = 0; i < n; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[i + 1]; s += `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${K}" stroke-width="22" stroke-linecap="round"/><path d="M${x1} ${y1}L${x2} ${y2}" stroke="url(#gm)" stroke-width="14" stroke-linecap="round"/>`; }
  s += pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="6" fill="url(#gs)" stroke="${K}" stroke-width="2.5"/>`).join('');
  const [ex, ey] = pts[pts.length - 1];
  s += `<rect x="${ex - 4}" y="${ey - 18}" width="44" height="36" rx="8" fill="url(#gk)" ${o(3.5)}/><circle cx="${ex + 18}" cy="${ey}" r="5" fill="url(#gs)"/>`;
  return `<g>${s}</g>`;
}

// ---------- Szenen ----------
const ART = {};

   <path d="M340 327C430 334 520 309 684 316" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 7" opacity="0.45"/>
   <ellipse cx="716" cy="314" rx="26" ry="14" fill="none" stroke="${K}" stroke-width="13"/>

   ${at(326, 282, 1, 0, roll(46, 'url(#gm)'))}
   <path d="M396 282H736M396 274v16M736 274v16" stroke="#cfcfcf" stroke-width="3" stroke-dasharray="7 6"/>
   ${label(566, 278, '4,5 M', { size: 20, bg: K, stroke: true })}
   <g transform="translate(616 220)"><circle r="30" fill="url(#gw)" ${o()}/><circle r="13" fill="#262626" ${o(3)}/>
     <path d="M22 20L48 30V44L18 32" fill="url(#gw)" ${o(3)}/>${shine('M-20-14a24 24 0 0 1 16-12', 4, 0.6)}</g>`);
};

ART['tennisschuhe-padelschuhe'] = () => {
  const c = COL.racket;
  const cols = [['sand', 'SAND', '#c8693a', 110], ['hart', 'HARTPLATZ', '#3b6fb6', 300], ['halle', 'HALLE', '#9a3b3b', 490], ['padel', 'PADEL', '#3e8a54', 680]];
  return scene('racket', 'Ratgeber Tennis- und Padelschuhe: vier Schuhsohlen von unten über ihrem Belag, Fischgrätprofil für Sand, Allcourt-Sohle für Hartplatz, glatte Sohle für die Teppichhalle und Padelsohle für Kunstrasen mit Sand',
  lin('sole', '#f2f2f2', '#bdbdbd'),
  `${cols.map(([k, , col, x], i) => `<rect x="${x - 95}" y="274" width="190" height="76" fill="${col}"/>${k === 'padel' ? Array.from({ length: 40 }, (_, j) => `<circle cx="${x - 88 + (j * 37) % 180}" cy="${282 + (j * 17) % 64}" r="2" fill="#f3e2b8" opacity="0.8"/>`).join('') : ''}${k === 'sand' ? Array.from({ length: 30 }, (_, j) => `<circle cx="${x - 88 + (j * 41) % 180}" cy="${280 + (j * 23) % 66}" r="1.8" fill="#8e4320" opacity="0.6"/>`).join('') : ''}`).join('')}
   <rect y="270" width="800" height="6" fill="${K}"/><path d="M0 300H800" stroke="#fff" stroke-width="5" opacity="0.85"/>
   <path d="M205 274V350M395 274V350M585 274V350" stroke="${K}" stroke-width="3" opacity="0.5"/>
   ${cols.map(([k, , , x], i) => at(x, 148, 0.74, i % 2 ? 6 : -6, sole(k))).join('')}
   ${cols.map(([, t, , x]) => label(x, 326, t, { size: 15, bg: K, stroke: true, wf: 0.72 })).join('')}
   ${at(176, 252, 0.6, 0, T.tennisball())}
   ${at(742, 252, 0.6, 0, T.tennisball())}`);
};

// Kettlebell mit Gewichtsangabe
const kb = (num, fill = 'url(#gm)') => `<g>
  <path d="M-36-30C-40-66-26-82 0-82S40-66 36-30" fill="none" stroke="${K}" stroke-width="24"/>
  <path d="M-36-30C-40-66-26-82 0-82S40-66 36-30" fill="none" stroke="url(#gk)" stroke-width="15"/>
  <path d="M-56 10C-56-28-30-44 0-44S56-28 56 10C56 40 40 60 30 62H-30C-40 60-56 40-56 10Z" fill="${fill}" ${o()}/>
  <rect x="-34" y="56" width="68" height="12" rx="4" fill="url(#gk)" ${o(3)}/>
  <text y="20" text-anchor="middle" font-family="Segoe UI, Arial" font-weight="900" font-style="italic" font-size="26" fill="#fff" opacity="0.92">${num}</text>
  ${shine('M-40-6C-38-24-24-34-10-36', 7, 0.4)}</g>`;

ART['kettlebell-gewicht'] = () => {
  const c = COL.fitness;
  const bells = [[112, 8, 0.66, 1], [252, 12, 0.76, 0], [402, 16, 0.86, 1], [560, 20, 0.96, 0], [716, 24, 1.06, 0]];
  return scene('fitness', 'Ratgeber Kettlebell-Gewicht: fünf Kettlebells von 8 bis 24 Kilogramm nebeneinander, eine leichte mit 8 und eine schwere mit 16 Kilogramm hervorgehoben',
  `<pattern id="rub" width="64" height="64" patternUnits="userSpaceOnUse"><rect width="64" height="64" fill="#232323"/><circle cx="12" cy="14" r="1.6" fill="#3d3d3d"/><circle cx="44" cy="40" r="1.6" fill="${c[1]}" opacity="0.6"/></pattern>`,
  `<rect y="292" width="800" height="58" fill="url(#rub)"/><rect y="288" width="800" height="6" fill="url(#gm)"/>
   ${tick(586, 70, c[1])}
   ${bells.map(([x, n, s, hi]) => `<ellipse cx="${x}" cy="292" rx="${46 * s}" ry="6" fill="#000" opacity="0.35"/>` + at(x, 292 - 68 * s, s, 0, kb(n, hi ? 'url(#gm)' : 'url(#gk)'))).join('')}
   ${label(112, 292 - 162 * 0.66 - 30, 'LEICHT', { size: 17, bg: K, stroke: true, wf: 0.72 })}
   ${label(402, 292 - 162 * 0.86 - 30, 'SCHWER', { size: 17, bg: c[1], stroke: true, wf: 0.72 })}
   <g font-family="Segoe UI, Arial" font-weight="800" font-size="16" fill="#cfcfcf" text-anchor="middle">${bells.map(([x, n]) => `<text x="${x}" y="326">${n} kg</text>`).join('')}</g>`);
};

// Ausgabe
for (const slug of Object.keys(ART)) {
  const ta = document.createElement('textarea');
  ta.id = 'out-' + slug;
  ta.textContent = ART[slug]();
  document.body.appendChild(ta);
}
// Vorschau, wenn die Seite direkt im Browser geöffnet wird
for (const slug of Object.keys(ART)) {
  const d = document.createElement('div');
  d.style.cssText = 'display:inline-block;margin:6px;width:400px';
  d.innerHTML = ART[slug]().replace('width="800" height="350"', 'width="400" height="175"');
  document.body.appendChild(d);
}
</script>
</body></html>
