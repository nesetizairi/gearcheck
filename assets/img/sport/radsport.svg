      <stop offset="1" stop-color="#faf8ff"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a77bff"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <g id="spokes" stroke="#9e9e9e" stroke-width="1.2">
      <path d="M0-48V48"/>
      <path d="M0-48V48" transform="rotate(18)"/>
      <path d="M0-48V48" transform="rotate(36)"/>
      <path d="M0-48V48" transform="rotate(54)"/>
      <path d="M0-48V48" transform="rotate(72)"/>
      <path d="M0-48V48" transform="rotate(90)"/>
      <path d="M0-48V48" transform="rotate(108)"/>
      <path d="M0-48V48" transform="rotate(126)"/>
      <path d="M0-48V48" transform="rotate(144)"/>
      <path d="M0-48V48" transform="rotate(162)"/>
    </g>
    <g id="wheel">
