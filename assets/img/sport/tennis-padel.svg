<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" aria-hidden="true">
  <!-- Tennis & Padel: Hartplatz mit Netz und Zaun, Padelschläger, Tennisschläger und Ball -->
  <defs>
    <clipPath id="panel"><polygon points="190,0 600,0 600,320 100,320"/></clipPath>
    <pattern id="fence" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#0b4a43"/>
      <path d="M0 6 6 0 12 6 6 12Z" fill="none" stroke="#2f8a7e" stroke-width="1"/>
    </pattern>
    <pattern id="netmesh" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0H6V6" fill="none" stroke="#0d0d0d" stroke-width="1"/>
    </pattern>
    <pattern id="strings" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M4 0V8M0 4H8" stroke="#f4f4f4" stroke-width="1.4"/>
    </pattern>
    <pattern id="holes" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="5.5" cy="5.5" r="2.4" fill="#0d0d0d"/>
    </pattern>
    <pattern id="grip" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="10" height="10" fill="#f4f4f4"/>
      <rect width="10" height="3" fill="#14b8a6"/>
    </pattern>
    <radialGradient id="ballG" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f6ff7a"/>
      <stop offset="0.6" stop-color="#d6ec3a"/>
      <stop offset="1" stop-color="#9fb51a"/>
    </radialGradient>
    <pattern id="fuzz" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff"/>
      <circle cx="3" cy="3" r="0.5" fill="#6e7d10"/>
    </pattern>
    <linearGradient id="padel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <clipPath id="padelface"><path d="M0-86C52-86 66-40 62 0 58 40 30 62 0 62-30 62-58 40-62 0-66-40-52-86 0-86Z"/></clipPath>
    <clipPath id="ballclip"><circle r="26"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="600" height="146" fill="url(#fence)"/>
    <rect y="0" width="600" height="6" fill="#0d0d0d"/>
    <rect y="76" width="600" height="40" fill="#0e5c53"/>
    <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" font-size="16" fill="#ffffff" opacity="0.9">
      <text x="212" y="102">GEARCHECK</text>
    </g>
    <rect y="140" width="600" height="180" fill="#0e7d71"/>
    <polygon points="250,146 600,146 600,320 78,320" fill="#13a596"/>
    <g fill="none" stroke="#ffffff" stroke-width="3">
      <path d="M250 146H600M250 146 78 320M282 146 134 320"/>
      <path d="M236 160H600M171 226H600M88 310H600"/>
      <path d="M440 160 386 226"/>
    </g>
    <!-- Netz -->
    <rect x="226" y="160" width="374" height="24" fill="url(#netmesh)"/>
    <rect x="226" y="156" width="374" height="6" fill="#ffffff" stroke="#0d0d0d" stroke-width="1.5"/>
    <rect x="220" y="150" width="7" height="38" fill="#dcdcdc" stroke="#0d0d0d" stroke-width="2"/>
    <ellipse cx="300" cy="284" rx="22" ry="4" fill="#000000" opacity="0.25"/>
    <ellipse cx="470" cy="304" rx="110" ry="8" fill="#000000" opacity="0.25"/>
  </g>
  <polygon points="177,0 190,0 100,320 87,320" fill="#14b8a6"/>
  <polygon points="163,0 168,0 78,320 73,320" fill="#0d0d0d"/>

  <!-- Padelschläger -->
  <g transform="translate(410 128) rotate(-30)">
    <path d="M-20 58C-12 70-10 80-10 96H10C10 80 12 70 20 58Z" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="2.5"/>
    <rect x="-11" y="94" width="22" height="72" rx="5" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="2.5"/>
    <path d="M-11 104H11M-11 116H11M-11 128H11M-11 140H11M-11 152H11" stroke="#14b8a6" stroke-width="2"/>
    <path d="M0 166C-24 196 22 210 6 170" fill="none" stroke="#14b8a6" stroke-width="4"/>
    <path d="M0-86C52-86 66-40 62 0 58 40 30 62 0 62-30 62-58 40-62 0-66-40-52-86 0-86Z" fill="url(#padel)"/>
    <g clip-path="url(#padelface)">
      <polygon points="-70,22 22,-70 44,-70 -70,44" fill="#14b8a6"/>
      <polygon points="-70,56 56,-70 64,-70 -70,64" fill="#ffffff" opacity="0.85"/>
      <g transform="scale(0.8)"><rect x="-70" y="-100" width="140" height="160" fill="url(#holes)"/></g>
    </g>
    <path d="M0-86C52-86 66-40 62 0 58 40 30 62 0 62-30 62-58 40-62 0-66-40-52-86 0-86Z" fill="none" stroke="#0d0d0d" stroke-width="7"/>
    <path d="M-40-70C-24-82 20-84 40-70" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Tennisschläger -->
  <g transform="translate(506 96) rotate(24)">
    <ellipse rx="52" ry="70" fill="url(#strings)"/>
    <path d="M-16 0-4 12 18-14" fill="none" stroke="#ff5a1f" stroke-width="6" stroke-linecap="square"/>
    <path d="M-30 72C-18 88-10 100-8 120M30 72C18 88 10 100 8 120" fill="none" stroke="#141414" stroke-width="9" stroke-linecap="round"/>
    <path d="M-26 70C-10 78 10 78 26 70" fill="none" stroke="#141414" stroke-width="7"/>
    <ellipse rx="60" ry="78" fill="none" stroke="#141414" stroke-width="12"/>
    <ellipse rx="60" ry="78" fill="none" stroke="#14b8a6" stroke-width="4" stroke-dasharray="70 46 40 400"/>
    <ellipse rx="60" ry="78" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="30 120" opacity="0.6"/>
    <rect x="-8" y="118" width="16" height="20" fill="#141414"/>
    <rect x="-11" y="136" width="22" height="92" rx="4" fill="url(#grip)" stroke="#0d0d0d" stroke-width="2.5"/>
    <rect x="-12" y="226" width="24" height="10" rx="3" fill="#141414"/>
  </g>

  <!-- Ball im Flug -->
  <g stroke="#0d0d0d" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M176 186H244M162 210H238M182 234H240"/>
  </g>
  <g transform="translate(290 210)">
    <g clip-path="url(#ballclip)">
      <circle r="26" fill="url(#ballG)"/>
      <circle r="26" fill="url(#fuzz)" opacity="0.35"/>
      <path d="M-18-18C-2-6-2 6-18 18M18-18C2-6 2 6 18 18" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    </g>
    <circle r="26" fill="none" stroke="#0d0d0d" stroke-width="3.5"/>
    <ellipse cx="-9" cy="-11" rx="6" ry="4" transform="rotate(-30 -9 -11)" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
