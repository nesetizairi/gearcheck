<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" aria-hidden="true">
  <!-- Kampfsport: Boxring im Scheinwerferlicht, hängender Boxsack, Boxhandschuh im Schlag -->
  <defs>
    <clipPath id="panel"><polygon points="190,0 600,0 600,320 100,320"/></clipPath>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121212"/>
      <stop offset="1" stop-color="#2b2b2b"/>
    </linearGradient>
    <radialGradient id="spot" cx="450" cy="-10" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4d52" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#e0262b" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e0262b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a99f93"/>
      <stop offset="1" stop-color="#e3dcd2"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d7d7d"/>
      <stop offset="0.4" stop-color="#f5f5f5"/>
      <stop offset="1" stop-color="#5e5e5e"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.25" stop-color="#363636"/>
      <stop offset="0.4" stop-color="#4c4c4c"/>
      <stop offset="0.72" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a0d11"/>
      <stop offset="0.3" stop-color="#d42228"/>
      <stop offset="0.42" stop-color="#ff6b70"/>
      <stop offset="0.75" stop-color="#b3161c"/>
      <stop offset="1" stop-color="#6e0b0f"/>
    </linearGradient>
    <linearGradient id="glove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff575c"/>
      <stop offset="0.5" stop-color="#e0262b"/>
      <stop offset="1" stop-color="#951116"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="600" height="320" fill="url(#room)"/>
    <rect width="600" height="320" fill="url(#spot)"/>
    <polygon points="0,248 600,238 600,320 0,320" fill="url(#canvas)"/>
    <path d="M0 248 600 238" stroke="#0d0d0d" stroke-width="3" opacity="0.6"/>
    <path d="M0 262 600 252" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
    <!-- Eckpfosten und Ringseile -->
    <rect x="566" y="52" width="22" height="192" fill="url(#post)" stroke="#0d0d0d" stroke-width="2.5"/>
    <g fill="none" stroke-linecap="round">
      <path d="M100 118Q340 134 570 108" stroke="#0d0d0d" stroke-width="10"/>
      <path d="M100 116Q340 132 570 106" stroke="#e0262b" stroke-width="6"/>
      <path d="M100 114Q340 130 570 104" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
      <path d="M100 160Q340 176 570 150" stroke="#0d0d0d" stroke-width="10"/>
      <path d="M100 158Q340 174 570 148" stroke="#f2f2f2" stroke-width="6"/>
      <path d="M100 202Q340 218 570 192" stroke="#0d0d0d" stroke-width="10"/>
      <path d="M100 200Q340 216 570 190" stroke="#e0262b" stroke-width="6"/>
      <path d="M100 198Q340 214 570 188" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    </g>
    <g fill="#e0262b" stroke="#0d0d0d" stroke-width="2.5">
      <rect x="558" y="94" width="38" height="24" rx="6"/>
      <rect x="558" y="136" width="38" height="24" rx="6"/>
      <rect x="558" y="178" width="38" height="24" rx="6"/>
    </g>
    <ellipse cx="462" cy="306" rx="62" ry="8" fill="#000000" opacity="0.3"/>
  </g>
  <polygon points="177,0 190,0 100,320 87,320" fill="#e0262b"/>
  <polygon points="163,0 168,0 78,320 73,320" fill="#0d0d0d"/>

  <!-- Boxsack, leicht ausschwingend -->
  <g transform="rotate(-4 450 0)">
    <g fill="none" stroke="#a6a6a6" stroke-width="3">
      <ellipse cx="450" cy="6" rx="4" ry="7"/>
      <path d="M450 12V24"/>
      <ellipse cx="450" cy="30" rx="4" ry="7"/>
    </g>
    <circle cx="450" cy="44" r="6" fill="#c9c9c9" stroke="#0d0d0d" stroke-width="2.5"/>
    <g stroke="#2e2e2e" stroke-width="3.5" stroke-linecap="round">
      <path d="M450 48 408 86M450 48 432 82M450 48 468 82M450 48 492 86"/>
    </g>
    <path d="M404 94Q404 86 412 86H488Q496 86 496 94V266Q496 298 450 298Q404 298 404 266Z" fill="url(#bag)" stroke="#0d0d0d" stroke-width="3"/>
    <ellipse cx="450" cy="89" rx="46" ry="7" fill="#2f2f2f" stroke="#0d0d0d" stroke-width="2.5"/>
    <rect x="404" y="112" width="92" height="18" fill="url(#band)"/>
    <rect x="404" y="240" width="92" height="18" fill="url(#band)"/>
    <g stroke="#ffffff" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.55">
      <path d="M404 115H496M404 127H496M404 243H496M404 255H496"/>
      <path d="M450 132V238" opacity="0.5"/>
    </g>
    <rect x="416" y="94" width="10" height="196" rx="5" fill="#ffffff" opacity="0.12"/>
    <rect x="432" y="164" width="36" height="36" rx="6" fill="#0d0d0d" stroke="#ff5a1f" stroke-width="2"/>
    <path d="M440 183 447 190 461 174" fill="none" stroke="#ff5a1f" stroke-width="4" stroke-linecap="square"/>
  </g>

  <!-- Schwung des Sacks -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M522 140Q536 172 524 206"/>
    <path d="M538 152Q548 176 540 200" opacity="0.6"/>
  </g>

  <!-- Bewegungslinien -->
  <g stroke="#e0262b" stroke-width="5" stroke-linecap="round">
    <path d="M78 156H146M60 186H136M84 216H142M70 246H128"/>
  </g>

  <!-- Boxhandschuh -->
  <g transform="translate(162 98) rotate(-5 125 95)">
    <path d="M8 48C30 44 70 42 96 44L100 160C72 164 34 164 10 158C2 156-2 120 0 100 1 76 3 54 8 48Z" fill="url(#glove)" stroke="#0d0d0d" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="7" cy="103" rx="10" ry="55" fill="#4a080b" stroke="#0d0d0d" stroke-width="4"/>
    <ellipse cx="8" cy="103" rx="5" ry="47" fill="none" stroke="#f4f4f4" stroke-width="3" opacity="0.85"/>
    <path d="M30 44C45 43 63 42 78 43L80 162C64 163 46 163 32 162Z" fill="url(#strap)" stroke="#0d0d0d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M36 52 38 154M73 51 74 155" stroke="#0d0d0d" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>
    <path d="M44 104 53 113 68 94" fill="none" stroke="#ff5a1f" stroke-width="6" stroke-linecap="square"/>
    <path d="M92 40C110 14 160 0 205 12 238 22 252 58 250 98 248 140 226 172 186 182 152 190 116 182 96 166Z" fill="url(#glove)" stroke="#0d0d0d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M98 150C130 178 190 182 232 136 222 168 198 184 170 187 140 189 112 179 96 166Z" fill="#5e080c" opacity="0.4"/>
    <path d="M174 10C220 24 242 62 238 106" fill="none" stroke="#0d0d0d" stroke-width="2.5" opacity="0.35"/>
    <path d="M100 47C118 23 162 11 203 21 231 31 243 61 242 96" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5 5" opacity="0.55"/>
    <path d="M112 40C132 22 168 14 196 22" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.4"/>
    <ellipse cx="220" cy="44" rx="12" ry="6" transform="rotate(35 220 44)" fill="#ffffff" opacity="0.5"/>
    <path d="M104 112C120 98 162 100 186 116 204 128 202 154 182 158 156 162 122 156 106 146 96 138 96 120 104 112Z" fill="url(#glove)" stroke="#0d0d0d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M112 114C135 105 165 107 183 121" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.6"/>
    <path d="M114 118C134 110 158 111 172 118" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <path d="M186 116C197 118 203 125 204 134" fill="none" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M122 170C150 178 188 174 212 158" fill="none" stroke="#0d0d0d" stroke-width="2.5" opacity="0.3"/>
  </g>
</svg>
