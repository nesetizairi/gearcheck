<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" aria-hidden="true">
  <!-- Running: Stadion-Laufbahn in der Kurve, Laufschuh im Schritt mit Staubwolke -->
  <defs>
    <clipPath id="panel"><polygon points="190,0 600,0 600,320 100,320"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f5c8"/>
      <stop offset="1" stop-color="#f9fcef"/>
    </linearGradient>
    <pattern id="tartan" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#3c4a5d"/>
      <circle cx="2" cy="3" r="0.9" fill="#55657b"/>
      <circle cx="7" cy="7" r="0.8" fill="#2c3848"/>
    </pattern>
    <pattern id="seats" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#cfd8bb"/>
      <rect y="6" width="8" height="2" fill="#b8c49f"/>
    </pattern>
    <linearGradient id="upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9fb5c"/>
      <stop offset="0.55" stop-color="#a3cf1c"/>
      <stop offset="1" stop-color="#6b8f0e"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4d4d4"/>
    </linearGradient>
    <pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#0d0d0d" opacity="0.18"/>
    </pattern>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="600" height="320" fill="url(#sky)"/>
    <!-- Tribüne und Anzeigetafel -->
    <polygon points="0,128 600,110 600,160 0,172" fill="url(#seats)"/>
    <polygon points="0,120 600,102 600,112 0,130" fill="#0d0d0d"/>
    <rect x="470" y="40" width="96" height="50" rx="4" fill="#0d0d0d"/>
    <rect x="478" y="48" width="80" height="34" rx="2" fill="#1f2a1a"/>
    <text x="518" y="72" text-anchor="middle" font-family="Courier New, monospace" font-weight="700" font-size="18" fill="#a3cf1c">0:42.8</text>
    <rect x="514" y="90" width="6" height="16" fill="#0d0d0d"/>
    <!-- Rasen innen -->
    <polygon points="0,172 600,160 600,186 0,218" fill="#8cc63f"/>
    <!-- Laufbahn -->
    <path d="M0 218C200 198 420 186 600 180V320H0Z" fill="url(#tartan)"/>
    <g fill="none" stroke="#ffffff">
      <path d="M0 218C200 198 420 186 600 180" stroke-width="5"/>
      <path d="M40 320C220 240 430 210 600 202" stroke-width="3"/>
      <path d="M200 320C330 254 480 226 600 220" stroke-width="3"/>
      <path d="M370 320C450 270 540 246 600 240" stroke-width="3"/>
      <path d="M540 320C570 296 590 282 600 276" stroke-width="3"/>
    </g>
    <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" fill="#ffffff" opacity="0.85">
      <text transform="translate(160 312) rotate(-22) scale(1 0.55)" font-size="44">4</text>
      <text transform="translate(330 300) rotate(-26) scale(1 0.55)" font-size="36">3</text>
      <text transform="translate(478 284) rotate(-30) scale(1 0.55)" font-size="28">2</text>
    </g>
    <ellipse cx="392" cy="292" rx="110" ry="10" fill="#000000" opacity="0.35"/>
  </g>
  <polygon points="177,0 190,0 100,320 87,320" fill="#a3cf1c"/>
  <polygon points="163,0 168,0 78,320 73,320" fill="#0d0d0d"/>

  <!-- Tempo-Linien und Staub -->
  <g stroke="#0d0d0d" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <path d="M118 150H196M100 178H186M126 206H192"/>
  </g>
  <g fill="#ffffff" stroke="#0d0d0d" stroke-width="2" opacity="0.9">
    <circle cx="232" cy="236" r="12"/>
    <circle cx="214" cy="222" r="8"/>
    <circle cx="246" cy="252" r="7"/>
  </g>

  <!-- Laufschuh -->
  <g transform="translate(232 96) rotate(-10 150 70)" stroke-linejoin="round">
    <path d="M12 120C12 132 22 138 36 138L252 130C276 128 294 116 300 100L296 96C288 110 272 120 250 122L34 128C22 128 14 124 12 116Z" fill="#161616"/>
    <g stroke="#3a3a3a" stroke-width="2">
      <path d="M50 131V137M80 130V136M110 129V135M140 128V134M170 127V133M200 126V132M230 124V130M260 121V126"/>
