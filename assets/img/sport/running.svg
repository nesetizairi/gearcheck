    <path d="M20 104C34 100 52 100 66 104 54 114 34 116 22 113Z" fill="#a3cf1c" stroke="#0d0d0d" stroke-width="2"/>
    <path d="M14 96C6 70 10 40 24 24 30 18 38 16 44 20 54 30 66 38 80 38 88 28 96 20 108 18 116 18 120 22 124 26 160 42 206 62 240 70 266 76 290 86 298 96 280 94 240 98 200 100 140 102 80 100 40 98 28 98 18 98 14 96Z" fill="url(#upper)" stroke="#0d0d0d" stroke-width="3.5"/>
    <path d="M14 96C6 70 10 40 24 24 30 18 38 16 44 20 54 30 66 38 80 38 88 28 96 20 108 18 116 18 120 22 124 26 160 42 206 62 240 70 266 76 290 86 298 96 280 94 240 98 200 100 140 102 80 100 40 98 28 98 18 98 14 96Z" fill="url(#mesh)"/>
    <path d="M14 96C6 70 10 40 24 24 36 44 46 70 46 98H40C28 98 18 98 14 96Z" fill="#161616"/>
    <path d="M24 58 34 56M22 66 34 64" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M26 24 18 6C17 3 19 1 22 1L30 2C33 2 35 4 35 7L38 22Z" fill="#161616" stroke="#0d0d0d" stroke-width="2"/>
    <path d="M44 20C54 30 66 38 80 38" fill="none" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round"/>
    <path d="M100 22C102 8 112 2 124 4 130 6 132 12 130 22Z" fill="url(#upper)" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M236 70C262 76 288 86 298 96 284 95 268 95 252 96 256 86 250 76 236 70Z" fill="#161616" opacity="0.9"/>
    <path d="M56 94C100 66 160 56 226 72L222 82C160 70 108 78 66 98Z" fill="#161616"/>
    <path d="M70 92C110 72 160 66 214 76" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <g stroke-linecap="round" transform="translate(-4 9) scale(1 0.8)">
      <path d="M129 21 143 42M143 28 129 35M149 28 163 49M163 35 149 42M169 35 183 56M183 42 169 49M189 43 203 64M203 50 189 57" stroke="#0d0d0d" stroke-width="7"/>
      <path d="M129 21 143 42M143 28 129 35M149 28 163 49M163 35 149 42M169 35 183 56M183 42 169 49M189 43 203 64M203 50 189 57" stroke="#ffffff" stroke-width="3.5"/>
    </g>
    <path d="M132 32C170 48 210 62 236 68" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
