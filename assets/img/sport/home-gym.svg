<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" aria-hidden="true">
  <!-- Home-Gym: Wand mit Akzentstreifen, Gummiboden, Hantelscheibe, Kettlebell und Kurzhantel -->
  <defs>
    <clipPath id="panel"><polygon points="190,0 600,0 600,320 100,320"/></clipPath>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1eb"/>
      <stop offset="1" stop-color="#e6d9cc"/>
    </linearGradient>
    <pattern id="rubber" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#262626"/>
      <circle cx="3" cy="4" r="1.1" fill="#585858"/>
      <circle cx="10" cy="9" r="1" fill="#ff5a1f" opacity="0.75"/>
      <circle cx="7" cy="12" r="0.9" fill="#474747"/>
    </pattern>
    <radialGradient id="plate" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#444444"/>
      <stop offset="1" stop-color="#101010"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="0.45" stop-color="#a3a3a3"/>
      <stop offset="0.62" stop-color="#e8e8e8"/>
      <stop offset="1" stop-color="#666666"/>
    </linearGradient>
    <radialGradient id="steelR" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#858585"/>
    </radialGradient>
    <radialGradient id="kb" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffa173"/>
      <stop offset="0.5" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#a8390c"/>
    </radialGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="0.24" stop-color="#3a3a3a"/>
      <stop offset="0.25" stop-color="#262626"/>
      <stop offset="0.75" stop-color="#1c1c1c"/>
      <stop offset="0.76" stop-color="#0e0e0e"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <pattern id="knurl" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0 5 5M5 0 0 5" stroke="#555555" stroke-width="0.8"/>
    </pattern>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="600" height="320" fill="url(#wall)"/>
    <rect y="112" width="600" height="20" fill="#ff5a1f"/>
    <rect y="132" width="600" height="5" fill="#0d0d0d"/>
    <!-- Wandregal mit Bändern -->
    <rect x="230" y="40" width="130" height="8" fill="#0d0d0d"/>
    <g fill="none" stroke-width="6" stroke-linecap="round">
      <path d="M250 48C246 74 262 84 258 104" stroke="#ff5a1f"/>
      <path d="M272 48C268 70 284 82 280 98" stroke="#0d0d0d"/>
      <path d="M294 48C292 66 304 76 300 92" stroke="#7a7a7a"/>
    </g>
    <polygon points="0,252 600,246 600,320 0,320" fill="url(#rubber)"/>
    <path d="M0 252 600 246" stroke="#0d0d0d" stroke-width="3"/>
    <g stroke="#0d0d0d" stroke-width="2" opacity="0.7">
      <path d="M210 251 168 320M350 249 340 320M490 247 512 320M0 286 600 281"/>
    </g>
    <ellipse cx="512" cy="252" rx="70" ry="6" fill="#000000" opacity="0.35"/>
  </g>
  <polygon points="177,0 190,0 100,320 87,320" fill="#ff5a1f"/>
  <polygon points="163,0 168,0 78,320 73,320" fill="#0d0d0d"/>

  <!-- Hantelscheibe an die Wand gelehnt -->
  <g transform="translate(508 166) rotate(-8)">
    <circle r="84" fill="url(#plate)" stroke="#0d0d0d" stroke-width="3"/>
    <circle r="76" fill="none" stroke="#000000" stroke-width="4"/>
    <circle r="80" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>
    <circle r="34" fill="none" stroke="#000000" stroke-width="3" opacity="0.6"/>
    <g fill="#e6d9cc" stroke="#0d0d0d" stroke-width="2.5">
      <rect x="-22" y="-62" width="44" height="18" rx="9"/>
      <rect x="-22" y="-62" width="44" height="18" rx="9" transform="rotate(120)"/>
      <rect x="-22" y="-62" width="44" height="18" rx="9" transform="rotate(240)"/>
    </g>
    <circle r="22" fill="url(#steelR)" stroke="#0d0d0d" stroke-width="2.5"/>
    <circle r="11" fill="#0d0d0d"/>
    <text x="0" y="62" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="17" fill="#ff5a1f">20 KG</text>
    <path d="M-64-44A78 78 0 0 1 18-76" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.22"/>
  </g>

  <!-- Kettlebell -->
  <ellipse cx="222" cy="300" rx="58" ry="9" fill="#000000" opacity="0.35"/>
  <g transform="translate(222 232)">
    <path d="M-34-24C-42-98 42-98 34-24" fill="none" stroke="#0d0d0d" stroke-width="22" stroke-linecap="round"/>
    <path d="M-34-24C-42-98 42-98 34-24" fill="none" stroke="#3a3a3a" stroke-width="15" stroke-linecap="round"/>
    <path d="M-30-40C-30-82 20-90 30-60" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
    <path d="M-56 16C-56-24-28-46 0-46S56-24 56 16C56 42 44 60 30 66H-30C-44 60-56 42-56 16Z" fill="url(#kb)" stroke="#0d0d0d" stroke-width="3.5"/>
    <circle cx="0" cy="10" r="25" fill="#ffffff" stroke="#0d0d0d" stroke-width="2.5"/>
    <text x="0" y="18" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="22" fill="#0d0d0d">16</text>
    <text x="0" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="8" fill="#0d0d0d">KG</text>
    <ellipse cx="-30" cy="-14" rx="9" ry="17" transform="rotate(32 -30 -14)" fill="#ffffff" opacity="0.4"/>
    <path d="M-30 66H30" stroke="#0d0d0d" stroke-width="4"/>
  </g>

  <!-- Kurzhantel mit Hex-Köpfen -->
  <ellipse cx="424" cy="312" rx="132" ry="8" fill="#000000" opacity="0.4"/>
  <g transform="translate(424 274) rotate(-3)">
    <rect x="-64" y="-9" width="128" height="18" fill="url(#steel)" stroke="#0d0d0d" stroke-width="2.5"/>
    <rect x="-44" y="-9" width="88" height="18" fill="url(#knurl)" opacity="0.8"/>
    <rect x="-72" y="-16" width="10" height="32" rx="2" fill="url(#steel)" stroke="#0d0d0d" stroke-width="2"/>
    <rect x="62" y="-16" width="10" height="32" rx="2" fill="url(#steel)" stroke="#0d0d0d" stroke-width="2"/>
    <g stroke="#0d0d0d" stroke-width="3">
      <rect x="-142" y="-40" width="72" height="80" rx="4" fill="url(#hex)"/>
      <rect x="70" y="-40" width="72" height="80" rx="4" fill="url(#hex)"/>
    </g>
    <g fill="#ff5a1f" stroke="#0d0d0d" stroke-width="2">
      <rect x="-122" y="-10" width="32" height="20" rx="3"/>
      <rect x="90" y="-10" width="32" height="20" rx="3"/>
    </g>
    <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="13" fill="#0d0d0d" text-anchor="middle">
      <text x="-106" y="5">15</text>
      <text x="106" y="5">15</text>
    </g>
    <path d="M-136-34H-76M76-34H136" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
  </g>
</svg>
