<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" aria-hidden="true">
  <!-- Wintersport: Alpenpanorama mit Sessellift und Tannen, gespurte Piste, gekreuzte Ski mit Skibrille -->
  <defs>
    <clipPath id="panel"><polygon points="190,0 600,0 600,320 100,320"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="topsheet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f7fb8"/>
      <stop offset="0.45" stop-color="#5fd2ff"/>
      <stop offset="1" stop-color="#1489c4"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf4a"/>
      <stop offset="0.4" stop-color="#ff6a3d"/>
      <stop offset="0.75" stop-color="#d43d9a"/>
      <stop offset="1" stop-color="#3b5bff"/>
    </linearGradient>
    <g id="tree">
      <rect x="-2.5" y="0" width="5" height="8" fill="#3b2a1e"/>
      <polygon points="0,-34 9,-18 5,-18 13,-6 8,-6 16,4 -16,4 -8,-6 -13,-6 -5,-18 -9,-18" fill="#1d4b5a"/>
      <polygon points="0,-34 9,-18 5,-18 13,-6 8,-6 16,4 0,4" fill="#123845"/>
      <path d="M-6-18H5M-9-6H8" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    </g>
    <g id="ski">
      <path d="M-12 16C-12-4 12-4 12 16L9 125 11 250H-11L-9 125Z" fill="url(#topsheet)" stroke="#0d0d0d" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-10 44 10 32V46L-10 58Z" fill="#ffffff"/>
      <path d="M-10 66 10 54V60L-10 72Z" fill="#0d0d0d"/>
      <path d="M-9 228 9 216V230L-9 242Z" fill="#ffffff"/>
      <rect x="-10" y="148" width="20" height="16" rx="3" fill="#1a1a1a"/>
      <rect x="-6" y="164" width="12" height="22" fill="#7a7a7a"/>
      <rect x="-11" y="186" width="22" height="24" rx="4" fill="#1a1a1a"/>
      <rect x="-4" y="190" width="8" height="6" rx="1" fill="#38bdf8"/>
      <path d="M-11 204-16 218M11 204 16 218" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
      <path d="M-7 20-5 240" stroke="#ffffff" stroke-width="2" opacity="0.45"/>
    </g>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="600" height="320" fill="url(#sky)"/>
    <circle cx="250" cy="52" r="22" fill="#ffffff" opacity="0.95"/>
    <circle cx="250" cy="52" r="34" fill="#ffffff" opacity="0.25"/>
    <!-- Hintere Bergkette -->
    <polygon points="100,196 170,126 220,152 300,78 360,132 420,100 500,152 560,116 600,138 600,236 100,236" fill="#a9cfe2"/>
    <polygon points="300,78 322,104 310,100 300,110 290,100 278,104" fill="#ffffff"/>
    <polygon points="420,100 438,120 428,117 420,124 412,117 402,120" fill="#ffffff"/>
    <polygon points="560,116 576,134 568,131 560,138 552,131 544,134" fill="#ffffff"/>
    <!-- Hauptgipfel mit Licht- und Schattenseite -->
    <polygon points="372,86 250,252 380,252 386,160" fill="#f6fbff"/>
    <polygon points="372,86 386,160 380,252 510,252" fill="#b5d4e5"/>
    <path d="M378 100 386 124M394 142 402 164M410 186 420 206" stroke="#7fa5ba" stroke-width="3" stroke-linecap="round"/>
    <polygon points="528,130 450,252 528,252 522,184" fill="#f6fbff"/>
    <polygon points="528,130 522,184 528,252 600,236 600,200" fill="#b5d4e5"/>
    <!-- Sessellift -->
    <path d="M120 40 600 168M120 48 600 176" stroke="#0d0d0d" stroke-width="1.5"/>
    <path d="M330 96V196M324 96H336" stroke="#0d0d0d" stroke-width="4"/>
    <g fill="none" stroke="#0d0d0d" stroke-width="2">
      <path d="M232 70V88M222 88H242V96H222M258 77V95M248 95H268V103H248"/>
      <path d="M404 116V134M394 134H414V142H394M482 137V155M472 155H492V163H472"/>
    </g>
    <g fill="#38bdf8"><rect x="223" y="89" width="18" height="6"/><rect x="249" y="96" width="18" height="6"/><rect x="395" y="135" width="18" height="6"/><rect x="473" y="156" width="18" height="6"/></g>
    <!-- Tannen -->
    <use href="#tree" x="230" y="238"/>
    <use href="#tree" x="254" y="244"/>
    <use href="#tree" x="276" y="236"/>
    <use href="#tree" x="560" y="228"/>
    <use href="#tree" x="584" y="236"/>
    <!-- Piste -->
    <path d="M100 320V252C220 240 360 250 600 236V320Z" fill="#ffffff"/>
    <g fill="none" stroke="#d5ecf7" stroke-width="2">
      <path d="M100 266C220 256 360 264 600 252M100 282C220 272 360 280 600 270M100 300C220 290 360 298 600 288"/>
    </g>
    <path d="M150 320C220 290 260 270 340 262S440 250 470 244M164 320C234 292 274 274 354 266S452 254 482 248" fill="none" stroke="#7fc8ea" stroke-width="3"/>
  </g>
  <polygon points="177,0 190,0 100,320 87,320" fill="#38bdf8"/>
  <polygon points="163,0 168,0 78,320 73,320" fill="#0d0d0d"/>

  <!-- Gekreuzte Ski im Schnee -->
  <use href="#ski" transform="translate(470 40) rotate(-15)"/>
  <use href="#ski" transform="translate(540 40) rotate(15)"/>
  <path d="M396 320C414 290 466 278 505 280 548 278 590 290 600 300V320Z" fill="#ffffff" stroke="#a9d4ea" stroke-width="2"/>
  <path d="M430 304C460 296 500 294 540 298" fill="none" stroke="#d5ecf7" stroke-width="3"/>

  <!-- Skibrille am Kreuzungspunkt -->
  <g transform="translate(505 222)">
    <path d="M-44-4C-62-40-20-64 0-54 20-64 62-40 44-4" fill="none" stroke="#0d0d0d" stroke-width="13" stroke-linecap="round"/>
    <path d="M-44-4C-62-40-20-64 0-54 20-64 62-40 44-4" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <path d="M-44-4C-62-40-20-64 0-54 20-64 62-40 44-4" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>
    <rect x="-52" y="-28" width="104" height="56" rx="26" fill="#0d0d0d"/>
    <rect x="-46" y="-22" width="92" height="44" rx="21" fill="url(#lens)"/>
    <path d="M-38 10-22-6-8 6 6-8 24 8 38 0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" opacity="0.55"/>
    <path d="M-36-12C-20-18 10-18 28-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M-12 28C-8 14 8 14 12 28Z" fill="#ffffff"/>
  </g>
</svg>
