<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" aria-hidden="true">
  <!-- Schwimmen: Hallenbad mit Kacheln, Wasser mit Lichtspiel, Bahnleinen, Startblock, Schwimmbrille und Badekappe -->
  <defs>
    <clipPath id="panel"><polygon points="190,0 600,0 600,320 100,320"/></clipPath>
    <pattern id="tiles" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f4f9ff"/>
      <path d="M0 0H20V20" fill="none" stroke="#c9dcf2" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ed6ff"/>
      <stop offset="0.5" stop-color="#3d8ff0"/>
      <stop offset="1" stop-color="#1a5cc4"/>
    </linearGradient>
    <pattern id="caustic" width="70" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 22C12 12 24 30 36 20S56 8 70 18M18 0C24 10 14 18 22 30S20 40 26 44M50 0C56 12 46 20 54 30S52 40 58 44" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.45"/>
    </pattern>
    <pattern id="floatS" x="0" y="104" width="12" height="8" patternUnits="userSpaceOnUse">
      <ellipse cx="3" cy="4" rx="2.6" ry="3.6" fill="#1d6fe0"/>
      <ellipse cx="9" cy="4" rx="2.6" ry="3.6" fill="#ffffff"/>
    </pattern>
    <pattern id="floatM" x="0" y="150" width="20" height="14" patternUnits="userSpaceOnUse">
      <ellipse cx="5" cy="7" rx="4.4" ry="6.4" fill="#1d6fe0" stroke="#0d0d0d" stroke-width="1"/>
      <ellipse cx="15" cy="7" rx="4.4" ry="6.4" fill="#ffffff" stroke="#0d0d0d" stroke-width="1"/>
    </pattern>
    <pattern id="floatL" x="0" y="214" width="32" height="26" patternUnits="userSpaceOnUse">
      <ellipse cx="8" cy="13" rx="7" ry="11.5" fill="#1d6fe0" stroke="#0d0d0d" stroke-width="1.5"/>
      <ellipse cx="6" cy="9" rx="2" ry="4" fill="#ffffff" opacity="0.6"/>
      <ellipse cx="24" cy="13" rx="7" ry="11.5" fill="#ffffff" stroke="#0d0d0d" stroke-width="1.5"/>
      <ellipse cx="22" cy="9" rx="2" ry="4" fill="#ffffff" opacity="0.9"/>
    </pattern>
    <pattern id="grate" width="6" height="10" patternUnits="userSpaceOnUse">
      <rect width="6" height="10" fill="#cfd8e2"/>
      <rect width="3" height="10" fill="#7b8a99"/>
    </pattern>
    <pattern id="deck" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#eef3f7"/>
      <path d="M0 0H30V30" fill="none" stroke="#d2dde6" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e8e8e"/>
      <stop offset="0.4" stop-color="#f6f6f6"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb04a"/>
      <stop offset="0.45" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#3b5bff"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#6aa6ff"/>
      <stop offset="0.6" stop-color="#1d6fe0"/>
      <stop offset="1" stop-color="#0f428f"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="600" height="80" fill="url(#tiles)"/>
    <rect x="300" y="18" width="10" height="56" fill="#1d6fe0"/>
    <rect x="286" y="18" width="38" height="10" fill="#1d6fe0"/>
    <rect x="470" y="18" width="10" height="56" fill="#1d6fe0"/>
    <rect x="456" y="18" width="38" height="10" fill="#1d6fe0"/>
    <rect y="72" width="600" height="8" fill="#0d0d0d"/>
    <rect y="80" width="600" height="190" fill="url(#water)"/>
    <rect y="80" width="600" height="190" fill="url(#caustic)"/>
    <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <path d="M220 94C232 90 244 98 256 94M380 92C392 88 404 96 416 92M300 130C316 126 332 134 348 130M480 128C494 124 508 132 522 128M240 190C258 184 276 194 294 188M430 186C448 180 466 190 484 184"/>
    </g>
    <path d="M0 108H600M0 157H600M0 227H600" stroke="#0d0d0d" stroke-width="1.5" opacity="0.6"/>
    <rect y="104" width="600" height="8" fill="url(#floatS)"/>
    <rect y="150" width="600" height="14" fill="url(#floatM)"/>
    <rect y="214" width="600" height="26" fill="url(#floatL)"/>
    <rect y="268" width="600" height="10" fill="url(#grate)"/>
    <rect y="278" width="600" height="42" fill="url(#deck)"/>
    <path d="M0 268H600" stroke="#0d0d0d" stroke-width="2.5"/>
    <ellipse cx="534" cy="306" rx="54" ry="6" fill="#000000" opacity="0.25"/>
  </g>
  <polygon points="177,0 190,0 100,320 87,320" fill="#1d6fe0"/>
  <polygon points="163,0 168,0 78,320 73,320" fill="#0d0d0d"/>

  <!-- Startblock -->
  <g stroke="#0d0d0d" stroke-width="2.5" stroke-linejoin="round">
    <rect x="500" y="300" width="70" height="8" fill="#6e6e6e"/>
    <rect x="516" y="196" width="38" height="106" fill="url(#steel)"/>
    <polygon points="468,192 596,176 596,192 470,208" fill="#e9e9e9"/>
    <polygon points="470,186 594,170 596,176 468,192" fill="#2b2b2b"/>
    <rect x="507" y="218" width="56" height="46" rx="4" fill="#1d6fe0"/>
    <path d="M586 190V212H600" fill="none" stroke="#9a9a9a" stroke-width="5"/>
  </g>
  <text x="535" y="255" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#ffffff">4</text>

  <!-- Badekappe -->
  <ellipse cx="236" cy="306" rx="46" ry="7" fill="#000000" opacity="0.22"/>
  <g transform="translate(236 300)">
    <path d="M-44 0C-44-40-22-58 0-58S44-40 44 0Z" fill="url(#cap)" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M-44 0H44" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M-30-28C-24-42-12-50 2-52" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <path d="M-10-24-2-16 14-34" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="square"/>
  </g>

  <!-- Schwimmbrille -->
  <ellipse cx="380" cy="308" rx="80" ry="6" fill="#000000" opacity="0.22"/>
  <g transform="translate(380 290) rotate(-4)">
    <path d="M-78 2C-96-6-100-30-80-36M78 2C96-6 100-30 80-36" fill="none" stroke="#0d0d0d" stroke-width="9" stroke-linecap="round"/>
    <path d="M-78 2C-96-6-100-30-80-36M78 2C96-6 100-30 80-36" fill="none" stroke="#1d6fe0" stroke-width="5" stroke-linecap="round"/>
    <path d="M-80-36C-40-46 40-46 80-36" fill="none" stroke="#0d0d0d" stroke-width="9" stroke-linecap="round"/>
    <path d="M-80-36C-40-46 40-46 80-36" fill="none" stroke="#1d6fe0" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#0d0d0d" stroke-width="3">
      <rect x="-76" y="-20" width="62" height="36" rx="17" fill="#1a1a1a"/>
      <rect x="14" y="-20" width="62" height="36" rx="17" fill="#1a1a1a"/>
      <rect x="-70" y="-15" width="50" height="26" rx="13" fill="url(#lens)"/>
      <rect x="20" y="-15" width="50" height="26" rx="13" fill="url(#lens)"/>
    </g>
    <path d="M-14-4C-6-12 6-12 14-4" fill="none" stroke="#0d0d0d" stroke-width="5" stroke-linecap="round"/>
    <path d="M-62-7C-52-11-42-11-34-8M28-7C38-11 48-11 56-8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
