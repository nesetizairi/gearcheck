<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" aria-hidden="true">
  <!-- Ratgeber Zwiebelprinzip: Chalet-Holzwand mit drei Schichten an Haken (Basisschicht, Fleece, Skijacke), Fenster mit Schneeblick, Thermometer, Bank mit Socken und Fäustlingen -->
  <defs>
    <pattern id="planks" width="64" height="350" patternUnits="userSpaceOnUse">
      <rect width="64" height="350" fill="#b98352"/>
      <rect x="0" width="4" height="350" fill="#7a5130"/>
      <path d="M14 30c10 20 6 40 12 70M40 140c-8 30 6 50 0 90M20 250c6 20 2 40 8 70" fill="none" stroke="#9c6a3e" stroke-width="2"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.15"/><stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.25"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fdcff"/><stop offset="1" stop-color="#eaf8ff"/></linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fe0ff"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#0e7fb6"/></linearGradient>
    <pattern id="fleece" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#2b4c7e"/><circle cx="2" cy="2" r="1.4" fill="#3b62a0"/><circle cx="6" cy="6" r="1.4" fill="#3b62a0"/></pattern>
    <pattern id="merino" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#c9d6df"/><path d="M0 3h6" stroke="#b3c3ce" stroke-width="1"/></pattern>
    <path id="top" d="M-30 0C-20 10 20 10 30 0L70 16 92 118 72 124 56 52 52 170H-52L-56 52-72 124-92 118-70 16z"/>
    <g id="hanger"><path d="M0-30v-8a7 7 0 1 1 7-7" fill="none" stroke="#555" stroke-width="3"/><path d="M-60-6 0-30 60-6" fill="none" stroke="#5e3c20" stroke-width="6" stroke-linecap="round"/></g>
  </defs>

  <rect width="800" height="350" fill="url(#planks)"/>
  <rect width="800" height="350" fill="url(#shade)"/>
  <!-- Fenster -->
  <rect x="26" y="56" width="150" height="176" rx="4" fill="url(#win)" stroke="#4a2f19" stroke-width="8"/>
  <polygon points="30,200 80,120 110,160 140,130 172,170 172,228 30,228" fill="#ffffff"/>
  <polygon points="80,120 110,160 96,156 80,170" fill="#b5d4e5"/>
  <path d="M101 56v176M26 144h150" stroke="#4a2f19" stroke-width="6"/>
  <path d="M30 60c14 6 20 16 22 30M172 60c-12 6-18 14-20 26M30 228c10-8 20-10 30-8" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
  <rect x="18" y="232" width="166" height="12" rx="3" fill="#6b4425" stroke="#3a2412" stroke-width="2"/>

  <!-- Hakenleiste -->
  <rect x="200" y="40" width="520" height="16" rx="3" fill="#5e3c20" stroke="#3a2412" stroke-width="3"/>
  <g fill="#c9c9c9" stroke="#0d0d0d" stroke-width="2.5"><circle cx="290" cy="48" r="6"/><circle cx="460" cy="48" r="6"/><circle cx="630" cy="48" r="6"/></g>

  <!-- 1 Basisschicht -->
  <g transform="translate(290 104) scale(0.78)">
    <use href="#hanger"/>
    <use href="#top" fill="url(#merino)" stroke="#0d0d0d" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-20 4c8 8 32 8 40 0" fill="none" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M-52 160h104" stroke="#9fb0bc" stroke-width="6"/>
  </g>
  <!-- 2 Fleece -->
  <g transform="translate(460 100) scale(0.88)">
    <use href="#hanger"/>
    <use href="#top" fill="url(#fleece)" stroke="#0d0d0d" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M0 2v168" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M-16-2 0 18 16-2" fill="#22406b" stroke="#0d0d0d" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-3" y="18" width="6" height="12" rx="2" fill="#c9c9c9"/>
    <path d="M-52 160h104" stroke="#1d3558" stroke-width="7"/>
  </g>
  <!-- 3 Skijacke -->
  <g transform="translate(630 98)">
    <use href="#hanger"/>
    <path d="M-30-2c4-24 56-24 60 0" fill="#0e7fb6" stroke="#0d0d0d" stroke-width="4"/>
    <use href="#top" fill="url(#jacket)" stroke="#0d0d0d" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M0 4v166" stroke="#0d0d0d" stroke-width="4"/>
    <path d="M-50 120h100" stroke="#ffffff" stroke-width="6"/>
    <path d="M-50 120h100" stroke="#0d0d0d" stroke-width="1.5" opacity="0.3"/>
    <rect x="-40" y="62" width="28" height="22" rx="4" fill="none" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M18 74h22" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M-52 160h104" stroke="#0b5f88" stroke-width="7"/>
    <path d="M-62 30c-4 30 0 60 6 90" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Nummern -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="20" text-anchor="middle" fill="#0d0d0d">
    <circle cx="232" cy="84" r="18" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/><text x="232" y="91">1</text>
    <circle cx="394" cy="84" r="18" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/><text x="394" y="91">2</text>
    <circle cx="560" cy="84" r="18" fill="#38bdf8" stroke="#0d0d0d" stroke-width="3"/><text x="560" y="91" fill="#ffffff">3</text>
  </g>

  <!-- Thermometer -->
  <rect x="736" y="70" width="40" height="170" rx="8" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/>
  <rect x="751" y="84" width="10" height="126" rx="5" fill="#eaeaea" stroke="#0d0d0d" stroke-width="2"/>
  <rect x="751" y="160" width="10" height="56" rx="5" fill="#e0262b"/>
  <circle cx="756" cy="220" r="11" fill="#e0262b" stroke="#0d0d0d" stroke-width="2.5"/>
  <g stroke="#0d0d0d" stroke-width="1.5"><path d="M764 100h6M764 120h6M764 140h6M764 160h8M764 180h6M764 200h6"/></g>
  <rect x="708" y="148" width="40" height="22" rx="4" fill="#0d0d0d"/>
  <text x="728" y="164" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff">−5°</text>

  <!-- Bank mit Socken und Fäustlingen -->
  <rect y="300" width="800" height="50" fill="#5e3c20"/>
  <rect x="0" y="288" width="800" height="16" fill="#7a5130" stroke="#3a2412" stroke-width="3"/>
  <g transform="translate(250 254)">
    <path d="M0 0h22v28l14 6a8 8 0 0 1-4 14L4 40z" fill="#e0262b" stroke="#0d0d0d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 6h22" stroke="#ffffff" stroke-width="4"/>
  </g>
  <g transform="translate(282 250)">
    <path d="M0 0h22v32l14 6a8 8 0 0 1-4 14L4 44z" fill="#e0262b" stroke="#0d0d0d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 6h22" stroke="#ffffff" stroke-width="4"/>
  </g>
  <g transform="translate(520 248)">
    <path d="M6 30l-10-10a6 6 0 0 1 9-8l9 8" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="2"/>
    <path d="M4 40V14a14 14 0 0 1 28 0v26z" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M4 32h28" stroke="#38bdf8" stroke-width="4"/>
  </g>
  <g transform="translate(560 248)">
    <path d="M30 30l10-10a6 6 0 0 0-9-8l-9 8" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="2"/>
    <path d="M4 40V14a14 14 0 0 1 28 0v26z" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M4 32h28" stroke="#38bdf8" stroke-width="4"/>
  </g>
</svg>
