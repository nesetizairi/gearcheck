<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" aria-hidden="true">
  <!-- Ratgeber Schienbeinschoner: von oben auf dem Rasen, Einschiebe-Schoner, Schoner mit Knöchelschutz, Halte-Strumpf, Massband und Grössen -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4be487"/><stop offset="0.55" stop-color="#16a34a"/><stop offset="1" stop-color="#0b6a30"/></linearGradient>
    <linearGradient id="shell2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe14d"/><stop offset="1" stop-color="#f2c400"/></linearGradient>
    <radialGradient id="ball" cx="0.36" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#e9e9e9"/><stop offset="1" stop-color="#a9a9a9"/></radialGradient>
    <path id="guard" d="M6 0C36-6 74-6 104 0l-6 172c-4 30-24 44-43 44S16 202 12 172z"/>
  </defs>

  <rect width="800" height="350" fill="#2fb35a"/>
  <g fill="#27a24f"><polygon points="0,0 90,0 -60,350 -150,350"/><polygon points="180,0 270,0 120,350 30,350"/><polygon points="360,0 450,0 300,350 210,350"/><polygon points="540,0 630,0 480,350 390,350"/><polygon points="720,0 810,0 660,350 570,350"/><polygon points="900,0 990,0 840,350 750,350"/></g>
  <polygon points="610,0 628,0 478,350 460,350" fill="#ffffff" opacity="0.9"/>

  <!-- Ball angeschnitten -->
  <g transform="translate(760 40)">
    <circle r="62" fill="url(#ball)" stroke="#0d0d0d" stroke-width="4"/>
    <path d="M0-22l21 15-8 25h-26l-8-25z" fill="#161616"/>
    <path d="M0-22V-60M21-7l36-12M13 18l22 30M-13 18l-22 30M-21-7l-36-12" stroke="#161616" stroke-width="4"/>
  </g>

  <!-- Einschiebe-Schoner -->
  <g transform="translate(150 40) rotate(-12 55 108)">
    <use href="#guard" fill="#000" opacity="0.25" transform="translate(10 10)"/>
    <use href="#guard" fill="url(#shell)" stroke="#0d0d0d" stroke-width="4"/>
    <path d="M16 10C40 6 70 6 94 10l-5 160c-4 22-18 32-34 32s-30-10-34-32z" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    <g fill="#0b6a30"><circle cx="34" cy="40" r="4"/><circle cx="55" cy="36" r="4"/><circle cx="76" cy="40" r="4"/><circle cx="40" cy="60" r="4"/><circle cx="70" cy="60" r="4"/></g>
    <path d="M38 118l12 12 26-30" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="square"/>
    <path d="M24 20c10-6 22-8 34-8" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Schoner mit Knöchelschutz -->
  <g transform="translate(330 34) rotate(10 55 130)">
    <path d="M14 196h82v40c0 18-18 30-41 30s-41-12-41-30z" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="4"/>
    <path d="M22 214h66M22 228h66M22 242h66" stroke="#3a3a3a" stroke-width="3"/>
    <circle cx="20" cy="232" r="13" fill="url(#shell2)" stroke="#0d0d0d" stroke-width="3"/>
    <circle cx="90" cy="232" r="13" fill="url(#shell2)" stroke="#0d0d0d" stroke-width="3"/>
    <use href="#guard" fill="url(#shell2)" stroke="#0d0d0d" stroke-width="4"/>
    <rect x="-6" y="70" width="122" height="22" rx="6" fill="#16a34a" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M2 81h106" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
    <path d="M24 20c10-6 22-8 34-8" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
    <path d="M40 138l10 10 22-26" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="square"/>
  </g>

  <!-- Halte-Strumpf -->
  <g transform="translate(540 60) rotate(-6)">
    <rect width="62" height="180" rx="24" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M6 20h50M6 30h50M6 160h50M6 150h50" stroke="#16a34a" stroke-width="3"/>
    <rect x="10" y="40" width="8" height="100" rx="4" fill="#ffffff" opacity="0.15"/>
  </g>

  <!-- Massband -->
  <g transform="translate(60 286) rotate(-2)">
    <rect width="680" height="34" fill="url(#tape)" stroke="#0d0d0d" stroke-width="3"/>
    <g stroke="#0d0d0d" stroke-width="2">
      <path d="M20 0v12M40 0v8M60 0v12M80 0v8M100 0v16M120 0v8M140 0v12M160 0v8M180 0v12M200 0v16M220 0v8M240 0v12M260 0v8M280 0v12M300 0v16M320 0v8M340 0v12M360 0v8M380 0v12M400 0v16M420 0v8M440 0v12M460 0v8M480 0v12M500 0v16M520 0v8M540 0v12M560 0v8M580 0v12M600 0v16M620 0v8M640 0v12M660 0v8"/>
    </g>
    <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="11" fill="#0d0d0d" text-anchor="middle">
      <text x="100" y="29">10</text><text x="200" y="29">20</text><text x="300" y="29">30</text><text x="400" y="29">40</text><text x="500" y="29">50</text><text x="600" y="29">60</text>
    </g>
  </g>
  <circle cx="752" cy="300" r="30" fill="#ffd21f" stroke="#0d0d0d" stroke-width="4"/>
  <circle cx="752" cy="300" r="14" fill="#0d0d0d"/>

  <!-- Grössen -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" text-anchor="middle">
    <circle cx="660" cy="130" r="22" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/><text x="660" y="137" fill="#0d0d0d">S</text>
    <circle cx="700" cy="180" r="22" fill="#16a34a" stroke="#0d0d0d" stroke-width="3"/><text x="700" y="187" fill="#ffffff">M</text>
    <circle cx="650" cy="226" r="22" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/><text x="650" y="233" fill="#0d0d0d">L</text>
  </g>
</svg>
