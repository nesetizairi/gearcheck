<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" aria-hidden="true">
  <!-- Ratgeber Velohelm: Werkstatt mit Lochwand, Grössentabelle, Laufrad, Werkzeug; Helm auf der Werkbank mit Massband 56 cm -->
  <defs>
    <pattern id="peg" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#e7e0f7"/><circle cx="11" cy="11" r="2.2" fill="#b9aee0"/></pattern>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7a06b"/><stop offset="1" stop-color="#9a6a3c"/></linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b48cff"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe14d"/><stop offset="1" stop-color="#f2c400"/></linearGradient>
    <g id="spk" stroke="#9e9e9e" stroke-width="1.2"><path d="M0-44V44"/><path d="M0-44V44" transform="rotate(22.5)"/><path d="M0-44V44" transform="rotate(45)"/><path d="M0-44V44" transform="rotate(67.5)"/><path d="M0-44V44" transform="rotate(90)"/><path d="M0-44V44" transform="rotate(112.5)"/><path d="M0-44V44" transform="rotate(135)"/><path d="M0-44V44" transform="rotate(157.5)"/></g>
  </defs>

  <rect width="800" height="350" fill="url(#peg)"/>
  <rect y="0" width="800" height="18" fill="#7c3aed"/>

  <!-- Laufrad an der Wand -->
  <path d="M120 30v20" stroke="#0d0d0d" stroke-width="4"/>
  <g transform="translate(120 112)">
    <circle r="58" fill="none" stroke="#161616" stroke-width="9"/>
    <circle r="50" fill="none" stroke="#c4c4c4" stroke-width="4"/>
    <use href="#spk"/>
    <circle r="7" fill="#d6d6d6" stroke="#0d0d0d" stroke-width="2"/>
  </g>

  <!-- Werkzeug -->
  <g stroke="#0d0d0d" stroke-width="3" stroke-linejoin="round">
    <path d="M250 50v10M290 50v10M330 50v10" stroke="#555"/>
    <path d="M244 62h12v74h-12z" fill="#9a9a9a"/>
    <path d="M238 62c0-10 24-10 24 0l-6 10h-12z" fill="#9a9a9a"/>
    <rect x="282" y="62" width="16" height="64" rx="6" fill="#7c3aed"/>
    <path d="M290 126v20" stroke-width="4"/>
    <path d="M318 62h24l-4 12h-16z" fill="#2a2a2a"/>
    <rect x="324" y="74" width="12" height="60" rx="3" fill="#ffd21f"/>
  </g>

  <!-- Grössentabelle -->
  <g transform="translate(560 40) rotate(2)">
    <rect width="190" height="130" rx="6" fill="#ffffff" stroke="#0d0d0d" stroke-width="3.5"/>
    <rect width="190" height="34" rx="6" fill="#0d0d0d"/>
    <text x="95" y="23" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff">HELMGRÖSSE</text>
    <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="15" fill="#0d0d0d">
      <text x="18" y="62">S</text><text x="70" y="62" font-family="Arial, sans-serif" font-weight="700">51–55 cm</text>
      <text x="18" y="90" fill="#7c3aed">M</text><text x="70" y="90" font-family="Arial, sans-serif" font-weight="700" fill="#7c3aed">55–59 cm</text>
      <text x="18" y="118">L</text><text x="70" y="118" font-family="Arial, sans-serif" font-weight="700">59–63 cm</text>
    </g>
    <path d="M12 72h166M12 100h166" stroke="#e2e2de" stroke-width="2"/>
    <circle cx="95" cy="-4" r="6" fill="#e0262b" stroke="#0d0d0d" stroke-width="2"/>
  </g>

  <!-- Werkbank -->
  <rect y="262" width="800" height="88" fill="#3a3942"/>
  <rect y="246" width="800" height="22" fill="url(#bench)" stroke="#0d0d0d" stroke-width="3"/>
  <path d="M40 254h200M300 258h260M600 254h180" stroke="#7d5330" stroke-width="2" opacity="0.6"/>

  <!-- Helm -->
  <ellipse cx="380" cy="250" rx="150" ry="10" fill="#000" opacity="0.25"/>
  <g transform="translate(250 92)">
    <path d="M22 156c-14-20-18-48-6-76C34 36 80 10 130 10c58 0 106 30 124 80 6 18 4 40-6 56l-12 10H40z" fill="url(#shell)" stroke="#0d0d0d" stroke-width="4" stroke-linejoin="round"/>
    <g fill="none" stroke-linecap="round">
      <g stroke="#0d0d0d" stroke-width="15">
        <path d="M58 108C76 84 104 70 136 68"/><path d="M84 54C106 40 134 34 160 36"/>
        <path d="M164 70C190 74 212 88 226 108"/><path d="M180 42C204 50 224 64 238 84"/>
      </g>
      <g stroke="#2a2a2a" stroke-width="9">
        <path d="M58 108C76 84 104 70 136 68"/><path d="M84 54C106 40 134 34 160 36"/>
        <path d="M164 70C190 74 212 88 226 108"/><path d="M180 42C204 50 224 64 238 84"/>
      </g>
      <g stroke="#7c3aed" stroke-width="2" opacity="0.8">
        <path d="M64 104C80 84 106 72 134 70"/><path d="M168 74C190 78 208 90 220 106"/>
      </g>
    </g>
    <path d="M40 120c50-20 140-24 200-6" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.5"/>
    <path d="M60 40c30-22 70-30 110-24" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
    <path d="M40 156h196l-8 8H48z" fill="#f4f4f4" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M70 160c-6 20 0 40 10 52M200 160c6 20 0 40-12 52" fill="none" stroke="#0d0d0d" stroke-width="5"/>
    <rect x="120" y="206" width="30" height="14" rx="3" fill="#0d0d0d"/>
    <path d="M80 212h40M150 212h38" stroke="#0d0d0d" stroke-width="5"/>
    <path d="M110 140l10 10 22-24" fill="none" stroke="#ff5a1f" stroke-width="6" stroke-linecap="square"/>
  </g>

  <!-- Massband -->
  <g transform="translate(560 220)">
    <ellipse cx="80" cy="26" rx="94" ry="24" fill="none" stroke="#0d0d0d" stroke-width="16"/>
    <ellipse cx="80" cy="26" rx="94" ry="24" fill="none" stroke="url(#tape)" stroke-width="11"/>
    <path d="M10 22v6M30 12v6M50 6v6M70 4v6M90 4v6M110 6v6M130 12v6M150 22v6" stroke="#0d0d0d" stroke-width="2"/>
    <g transform="translate(118 -24) rotate(-6)"><rect width="74" height="30" rx="6" fill="#7c3aed" stroke="#0d0d0d" stroke-width="3"/><text x="37" y="21" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="15" fill="#ffffff">56 cm</text></g>
  </g>
</svg>
