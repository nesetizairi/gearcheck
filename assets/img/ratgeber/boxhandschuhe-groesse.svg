<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" aria-hidden="true">
  <!-- Ratgeber Boxhandschuhe: drei Handschuhe in verschiedenen Grössen mit Unzen-Etiketten an der Gym-Wand, Bandagen auf der Bank -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141414"/><stop offset="1" stop-color="#2e2e2e"/></linearGradient>
    <radialGradient id="light" cx="440" cy="-60" r="460" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a5f" stop-opacity="0.5"/><stop offset="0.6" stop-color="#e0262b" stop-opacity="0.1"/><stop offset="1" stop-color="#e0262b" stop-opacity="0"/></radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5c61"/><stop offset="0.5" stop-color="#e0262b"/><stop offset="1" stop-color="#8f1014"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d39b66"/><stop offset="1" stop-color="#8a5a32"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f5f5"/><stop offset="0.5" stop-color="#8f8f8f"/><stop offset="1" stop-color="#d9d9d9"/></linearGradient>
    <g id="glove">
      <path d="M20 118C6 98 4 58 16 34 28 10 52 2 70 4c28 2 46 24 46 56l-2 34c-2 16-12 26-26 28H32c-6 0-10-2-12-4z" fill="url(#red)" stroke="#0d0d0d" stroke-width="4" stroke-linejoin="round"/>
      <path d="M30 116c26 6 58 6 82-14-4 14-14 20-26 22H32z" fill="#000" opacity="0.25"/>
      <path d="M38 26c18-10 46-10 64 4" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>
      <path d="M30 42c10-20 30-28 50-26" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
      <path d="M22 62C8 64 2 82 9 96c6 12 21 15 31 9 6-6 4-18-2-26z" fill="url(#red)" stroke="#0d0d0d" stroke-width="4" stroke-linejoin="round"/>
      <path d="M14 78c4-6 10-8 16-6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
      <rect x="28" y="118" width="70" height="56" rx="10" fill="url(#red)" stroke="#0d0d0d" stroke-width="4"/>
      <rect x="28" y="128" width="70" height="26" fill="#fff" stroke="#0d0d0d" stroke-width="3"/>
      <path d="M34 133h58M34 149h58" stroke="#0d0d0d" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
    </g>
    <g id="tag">
      <path d="M0 0h62l10 15-10 15H0z" fill="#fff" stroke="#0d0d0d" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="62" cy="15" r="3.5" fill="#0d0d0d"/>
    </g>
  </defs>

  <rect width="800" height="350" fill="url(#wall)"/>
  <rect width="800" height="350" fill="url(#light)"/>
  <rect y="226" width="800" height="16" fill="#e0262b"/>
  <rect y="242" width="800" height="4" fill="#0d0d0d"/>
  <path d="M54 118l28 28 56-64" fill="none" stroke="#e0262b" stroke-width="20" stroke-linecap="square" opacity="0.22"/>

  <!-- Hakenleiste -->
  <rect x="150" y="48" width="600" height="12" rx="3" fill="url(#metal)" stroke="#0d0d0d" stroke-width="3"/>
  <g fill="#cfcfcf" stroke="#0d0d0d" stroke-width="3">
    <rect x="254" y="58" width="12" height="12" rx="2"/>
    <rect x="424" y="58" width="12" height="12" rx="2"/>
    <rect x="614" y="58" width="12" height="12" rx="2"/>
  </g>

  <!-- Drei Handschuhe, kopfüber an der Schlaufe -->
  <g transform="translate(260 72) scale(0.8)"><path d="M-14 4 0-14 14 4" fill="none" stroke="#0d0d0d" stroke-width="4"/><g transform="translate(-60 0) rotate(180 60 87.5)"><use href="#glove"/></g></g>
  <g transform="translate(430 72) scale(0.95)"><path d="M-14 4 0-14 14 4" fill="none" stroke="#0d0d0d" stroke-width="4"/><g transform="translate(-60 0) rotate(180 60 87.5)"><use href="#glove"/></g></g>
  <g transform="translate(620 72) scale(1.08)"><path d="M-14 4 0-14 14 4" fill="none" stroke="#0d0d0d" stroke-width="4"/><g transform="translate(-60 0) rotate(180 60 87.5)"><use href="#glove"/></g></g>

  <!-- Unzen-Etiketten -->
  <g fill="none" stroke="#bdbdbd" stroke-width="2">
    <path d="M266 64 318 104M436 64 498 112M626 64 696 122"/>
  </g>
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="17" fill="#0d0d0d">
    <g transform="translate(316 96) rotate(10)"><use href="#tag"/><text x="9" y="21">10 oz</text></g>
    <g transform="translate(496 104) rotate(8)"><use href="#tag"/><text x="9" y="21">14 oz</text></g>
    <g transform="translate(694 114) rotate(6)"><use href="#tag"/><text x="9" y="21" fill="#e0262b">16 oz</text></g>
  </g>

  <!-- Bank mit Bandagen -->
  <rect x="60" y="300" width="720" height="50" fill="#0d0d0d" opacity="0.35"/>
  <rect x="120" y="306" width="18" height="44" fill="#5e3c20" stroke="#0d0d0d" stroke-width="3"/>
  <rect x="700" y="306" width="18" height="44" fill="#5e3c20" stroke="#0d0d0d" stroke-width="3"/>
  <rect x="70" y="288" width="700" height="20" rx="4" fill="url(#wood)" stroke="#0d0d0d" stroke-width="3"/>
  <path d="M90 296h150M300 300h220M580 295h170" stroke="#6b4425" stroke-width="2" opacity="0.6"/>
  <path d="M196 288c30 0 60-6 96-2" fill="none" stroke="#e0262b" stroke-width="12" stroke-linecap="round"/>
  <circle cx="176" cy="268" r="22" fill="#e0262b" stroke="#0d0d0d" stroke-width="3.5"/>
  <circle cx="176" cy="268" r="14" fill="none" stroke="#8f1014" stroke-width="2.5"/>
  <circle cx="176" cy="268" r="6" fill="#fff" stroke="#0d0d0d" stroke-width="2.5"/>
  <circle cx="128" cy="274" r="16" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="3"/>
  <circle cx="128" cy="274" r="10" fill="none" stroke="#3a3a3a" stroke-width="2.5"/>
  <circle cx="128" cy="274" r="4" fill="#fff"/>
</svg>
