<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" aria-hidden="true">
  <!-- Ratgeber Fussballschuhe: drei Platzbeläge (Naturrasen, Kunstrasen, Halle) mit je einer Sohle von unten (FG, AG, IN) -->
  <defs>
    <pattern id="turf" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#22c55e"/><circle cx="3" cy="3" r="1.4" fill="#111"/><circle cx="8" cy="7" r="1.1" fill="#111"/><path d="M5 10V6M1 10V7M9 10V7" stroke="#16a34a" stroke-width="1"/></pattern>
    <pattern id="wood" width="80" height="20" patternUnits="userSpaceOnUse"><rect width="80" height="20" fill="#e2ad73"/><path d="M0 0H80M0 20H80M30 0v10M70 10v10" stroke="#b9824b" stroke-width="1.5"/></pattern>
    <pattern id="herring" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#c98b4f"/><path d="M0 6l6-6 6 6M0 12l6-6 6 6" fill="none" stroke="#8a5528" stroke-width="1.6"/></pattern>
    <linearGradient id="plateW" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfcfcf"/></linearGradient>
    <linearGradient id="plateB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
    <path id="sole" d="M45 0C75 0 90 28 90 70c0 48-10 76-14 98-4 30-16 62-31 62s-27-32-31-62C10 146 0 118 0 70 0 28 15 0 45 0z"/>
    <clipPath id="soleclip"><use href="#sole"/></clipPath>
  </defs>

  <!-- Naturrasen -->
  <rect width="270" height="350" fill="#2fb35a"/>
  <g fill="#27a24f"><rect x="0" width="45" height="350"/><rect x="90" width="45" height="350"/><rect x="180" width="45" height="350"/></g>
  <path d="M0 330c10-10 14 0 20-12s10 6 18-6 12 8 20-4 10 6 18-6 12 8 20-6 12 6 20-4 10 8 18-6 12 6 20-4 10 6 18-6 12 8 20-4 12 6 20-6V350H0z" fill="#16883f"/>
  <!-- Kunstrasen -->
  <rect x="270" width="260" height="350" fill="url(#turf)"/>
  <!-- Halle -->
  <rect x="530" width="270" height="350" fill="url(#wood)"/>
  <path d="M530 70h270M680 0v350" stroke="#1d6fe0" stroke-width="5"/>
  <circle cx="680" cy="70" r="40" fill="none" stroke="#1d6fe0" stroke-width="5"/>
  <path d="M270 0v350M530 0v350" stroke="#0d0d0d" stroke-width="5"/>

  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="13" letter-spacing="1">
    <rect x="16" y="16" width="118" height="26" rx="5" fill="#0d0d0d"/><text x="26" y="34" fill="#ffffff">NATURRASEN</text>
    <rect x="286" y="16" width="118" height="26" rx="5" fill="#0d0d0d"/><text x="296" y="34" fill="#ffffff">KUNSTRASEN</text>
    <rect x="546" y="16" width="70" height="26" rx="5" fill="#0d0d0d"/><text x="556" y="34" fill="#ffffff">HALLE</text>
  </g>

  <!-- FG-Sohle -->
  <g transform="translate(92 68) rotate(-8 45 115)">
    <use href="#sole" fill="#000" opacity="0.25" transform="translate(8 8)"/>
    <use href="#sole" fill="url(#plateW)" stroke="#0d0d0d" stroke-width="4"/>
    <g clip-path="url(#soleclip)"><path d="M0 120h90v40H0z" fill="#16a34a"/><path d="M10 40h70" stroke="#16a34a" stroke-width="6"/></g>
    <g fill="#e9e9e9" stroke="#0d0d0d" stroke-width="3">
      <circle cx="26" cy="36" r="9"/><circle cx="64" cy="36" r="9"/><circle cx="18" cy="78" r="9"/><circle cx="72" cy="78" r="9"/>
      <rect x="38" y="62" width="14" height="34" rx="7"/>
      <circle cx="28" cy="196" r="9"/><circle cx="62" cy="196" r="9"/>
    </g>
    <path d="M22 32a4 4 0 0 1 6-2M60 32a4 4 0 0 1 6-2" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- AG-Sohle -->
  <g transform="translate(355 70) rotate(6 45 115)">
    <use href="#sole" fill="#000" opacity="0.3" transform="translate(8 8)"/>
    <use href="#sole" fill="url(#plateB)" stroke="#0d0d0d" stroke-width="4"/>
    <g fill="#d9d9d9" stroke="#0d0d0d" stroke-width="2">
      <circle cx="30" cy="22" r="5.5"/><circle cx="48" cy="20" r="5.5"/><circle cx="64" cy="26" r="5.5"/>
      <circle cx="20" cy="40" r="5.5"/><circle cx="38" cy="38" r="5.5"/><circle cx="56" cy="40" r="5.5"/><circle cx="72" cy="44" r="5.5"/>
      <circle cx="16" cy="60" r="5.5"/><circle cx="32" cy="58" r="5.5"/><circle cx="50" cy="58" r="5.5"/><circle cx="68" cy="62" r="5.5"/>
      <circle cx="18" cy="80" r="5.5"/><circle cx="36" cy="78" r="5.5"/><circle cx="54" cy="78" r="5.5"/><circle cx="72" cy="82" r="5.5"/>
      <circle cx="22" cy="100" r="5.5"/><circle cx="42" cy="98" r="5.5"/><circle cx="62" cy="102" r="5.5"/>
      <circle cx="28" cy="180" r="5.5"/><circle cx="46" cy="176" r="5.5"/><circle cx="62" cy="182" r="5.5"/>
      <circle cx="30" cy="198" r="5.5"/><circle cx="48" cy="200" r="5.5"/><circle cx="60" cy="198" r="5.5"/>
    </g>
    <path d="M20 140h50" stroke="#16a34a" stroke-width="6"/>
  </g>
  <!-- IN-Sohle -->
  <g transform="translate(620 68) rotate(-6 45 115)">
    <use href="#sole" fill="#000" opacity="0.25" transform="translate(8 8)"/>
    <use href="#sole" fill="url(#herring)" stroke="#0d0d0d" stroke-width="4"/>
    <circle cx="46" cy="58" r="18" fill="#b77a40" stroke="#0d0d0d" stroke-width="2.5"/>
    <circle cx="46" cy="58" r="10" fill="none" stroke="#0d0d0d" stroke-width="2"/>
    <circle cx="46" cy="190" r="14" fill="#b77a40" stroke="#0d0d0d" stroke-width="2.5"/>
    <path d="M14 132h62" stroke="#ffffff" stroke-width="5"/>
  </g>

  <!-- Kürzel -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" text-anchor="middle">
    <rect x="98" y="300" width="74" height="36" rx="8" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/><text x="135" y="326" fill="#16a34a">FG</text>
    <rect x="363" y="300" width="74" height="36" rx="8" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/><text x="400" y="326" fill="#16a34a">AG</text>
    <rect x="628" y="300" width="74" height="36" rx="8" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/><text x="665" y="326" fill="#16a34a">IN</text>
  </g>
</svg>
