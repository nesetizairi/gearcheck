  <path d="M208 214c80-10 164-10 244 0v28c-80-10-164-10-244 0z" fill="#0d0d0d"/>
  <text x="330" y="234" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-style="italic" font-size="12" fill="#ffffff" letter-spacing="1" opacity="0">GEARCHECK</text>
  <rect x="238" y="194" width="184" height="74" rx="34" fill="#0d0d0d"/>
  <rect x="250" y="206" width="160" height="50" rx="24" fill="url(#lens)"/>
  <g clip-path="url(#lensclip)">
    <polygon points="250,256 290,222 312,240 344,210 372,236 410,214 410,256" fill="#ffffff" opacity="0.35"/>
    <circle cx="378" cy="220" r="10" fill="#ffffff" opacity="0.7"/>
    <path d="M262 222c20-10 50-12 72-8" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>
  <path d="M314 268c4-14 28-14 32 0z" fill="#ffffff"/>
  <path d="M276 270h4M380 270h4" stroke="#0d0d0d" stroke-width="2"/>
  <!-- Glitzer im Schnee -->
  <g fill="#ffffff" stroke="#9fd8f2" stroke-width="1.5">
    <path d="M120 300l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><path d="M520 300l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M740 320l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/>
  </g>
